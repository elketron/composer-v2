<footer class="status-strip">
  @if (agentCount() > 0) {
    <span class="agents">
      @for (session of agentDots(); track session.sessionId) {
        <span class="dot pulse" [title]="session.sessionId"></span>
      }
      {{ agentCount() }} {{ agentLabel() }}
    </span>
  }

  <span class="spacer"></span>

  <span class="hint model">{{ model() }}</span>
  <span class="hint"><kbd>tab</kbd> next card</span>
</footer>
