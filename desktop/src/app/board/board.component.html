<div class="board">
  <header class="board-header">
    <nav class="pipeline-tabs" aria-label="pipeline boards">
      @for (pipeline of pipelineTabs(); track pipeline.id) {
        <button
          class="pipeline-tab"
          [class.active]="isTabSelected(pipeline)"
          (click)="selectTab(pipeline.id)"
        >
          {{ pipeline.name }}
        </button>
      }
    </nav>
    <app-type-selector [(selected)]="filter" />
    <button class="new-card" (click)="creating.set(!creating())">
      + new card
    </button>
  </header>

  <div class="board-body">
    <div class="board-area">
      @if (creating()) {
        <app-card-creator (closed)="creating.set(false)" />
      }

      @if (selectedPipeline(); as pipeline) {
        <app-board-columns [pipeline]="pipeline" [cards]="visibleCards()" [blockedIds]="blockedIds()" />
      } @else {
        <div class="state-empty"><span class="state-label">no pipelines</span>author one in the pipelines view</div>
      }
    </div>

    @if (selectedCard(); as card) {
      <app-card-panel class="panel-area" [card]="card" />
    }
  </div>

  @if (rejectionPrompt(); as prompt) {
    <div class="rejection-bar">
      <span class="label">rejected {{ prompt.cardId }} — comment (optional)</span>
      <input
        #comment
        class="input"
        placeholder="why is it going back?"
        (keydown.enter)="recordRejection(comment.value)"
        (keydown.escape)="skipRejection()"
      />
      <button class="action" (click)="recordRejection(comment.value)">record</button>
      <button class="action subtle" (click)="skipRejection()">skip</button>
    </div>
  }
</div>
