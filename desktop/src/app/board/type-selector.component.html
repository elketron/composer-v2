<div class="type-selector" role="tablist" aria-label="board type">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="tab"
      class="option"
      [class.active]="option.value === selected()"
      [attr.aria-selected]="option.value === selected()"
      (click)="selected.set(option.value)"
    >
      @if (option.icon; as icon) {
        <lucide-icon [img]="icon" [size]="11" [style.color]="option.accentVar" />
      }
      {{ option.label }}
    </button>
  }
</div>
