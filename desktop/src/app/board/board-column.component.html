<section class="column">
  <header class="header">
    <span class="label">{{ label() }}</span>
    @if (agentOwned()) {
      <button
        class="auto"
        [class.on]="automationOn()"
        title="agent automation for this lane"
        (click)="toggleAutomation()"
      >
        {{ automationOn() ? 'auto · on' : 'auto · off' }}
      </button>
    }
    <span class="count">{{ cards().length }}</span>
  </header>

  <div class="cards" cdkDropList [cdkDropListData]="lane()" (cdkDropListDropped)="onDrop($event)">
    @for (card of cards(); track card.id) {
      <app-board-card
        [card]="card"
        [blocked]="blockedIds().has(card.id)"
        (activated)="open($event)"
        cdkDrag
        [cdkDragData]="card"
        [cdkDragDisabled]="blockedIds().has(card.id)"
      />
    }
  </div>
</section>
