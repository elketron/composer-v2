<form class="creator" (submit)="$event.preventDefault(); submit()" (keydown)="keydown($event)">
  <div class="line">
    <input
      class="title"
      #titleInput
      type="text"
      name="title"
      placeholder="card title"
      autocomplete="off"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
      [disabled]="submitting()"
    />
    <button type="submit" class="create" [disabled]="submitting() || !title().trim()">add</button>
    <button type="button" class="cancel" [disabled]="submitting()" (click)="cancel()">cancel</button>
  </div>

  <details class="details">
    <summary>details</summary>
    <textarea
      class="description"
      name="description"
      rows="2"
      placeholder="description (optional)"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      [disabled]="submitting()"
    ></textarea>
    <div class="types">
      @for (option of typeOptions; track option) {
        <button
          type="button"
          class="type"
          [class.active]="type() === option"
          [style.--type-accent]="typeMeta[option].accentVar"
          [disabled]="submitting()"
          (click)="type.set(option)"
        >
          {{ typeMeta[option].label }}
        </button>
      }
    </div>
  </details>

  @if (error(); as message) {
    <p class="state-error" role="alert">{{ message }}</p>
  }

</form>
