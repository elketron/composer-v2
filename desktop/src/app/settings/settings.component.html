<div class="settings">
  <header class="head">
    <h1>settings</h1>
  </header>

  <section class="form">
    <label class="field">
      <span class="label">default model</span>
      <app-model-picker
        [value]="model()"
        [models]="availableModels()"
        [disabled]="saving()"
        (valueChange)="setModel($event)"
      />
      <span class="hint">
        what every agent loads unless it has its own override below — e.g.
        <code>llama/qwen3.8</code>. empty keeps the runtime's own default; the
        provider endpoints and credentials live in Pi's agent config
        (~/.pi/agent), not here.
      </span>
    </label>

    <div class="field">
      <span class="label">per-agent models</span>
      <div class="agent-rows">
        @for (kind of agentKinds(); track kind) {
          <div class="agent-row">
            <span class="agent-kind">{{ kind }}</span>
            <app-model-picker
              [value]="models()[kind] || ''"
              [models]="availableModels()"
              [disabled]="saving()"
              (valueChange)="setAgentModel(kind, $event)"
            />
          </div>
        }
      </div>
      <div class="add-row">
        <input
          type="text"
          name="new-agent"
          autocomplete="off"
          placeholder="add an agent kind…"
          [ngModel]="newAgent()"
          (ngModelChange)="newAgent.set($event)"
          (keydown.enter)="$event.preventDefault(); addAgent()"
          [disabled]="saving()"
        />
        <button type="button" class="add" [disabled]="saving() || !newAgent().trim()" (click)="addAgent()">
          add
        </button>
      </div>
      <span class="hint">
        overrides for one agent — the planner, the coder, the pipeline
        workers (tester, reviewer, security), or a custom agent kind.
      </span>
    </div>

    @if (error(); as message) {
      <p class="state-error" role="alert">{{ message }}</p>
    }
    @if (saved()) {
      <p class="saved" role="status">saved</p>
    }

    <footer class="actions">
      <button class="save" [disabled]="saving()" (click)="save()">save</button>
      <button class="reload" [disabled]="loading()" (click)="reload()">reload</button>
    </footer>
  </section>
</div>
